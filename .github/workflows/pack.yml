name: Build pack

on:
  push:
    branches: [main]
    paths:
      - 'pack/mods.txt'
      - 'pack/update-pack.sh'
      - '.github/workflows/pack.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  pack:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: 'stable'

      - name: Install packwiz
        run: go install github.com/packwiz/packwiz@latest

      - name: Resolve mod list
        run: |
          export PATH="$PATH:$(go env GOPATH)/bin"
          bash pack/update-pack.sh
        continue-on-error: true

      - name: Commit pack metadata and report
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add pack
          git diff --cached --quiet || git commit -m "Update pack metadata"
          git pull --rebase origin main || true
          git push || true

      - name: Export Modrinth pack
        if: always()
        run: |
          export PATH="$PATH:$(go env GOPATH)/bin"
          cd pack
          packwiz modrinth export || echo "export failed"
          ls -la

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: mine-pack-mrpack
          path: pack/*.mrpack
          if-no-files-found: warn
